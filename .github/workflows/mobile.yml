      # - name: Decode keystore
      #   run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > apps/web-app/android/app/release.jks
      #
      # - name: Build release AAB
      #   working-directory: apps/web-app/android
      #   run: ./gradlew bundleRelease
      #   env:
      #     KEYSTORE_PATH: release.jks
      #     KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      #     KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      #     KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      #
      # - name: Upload release AAB
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: nutriplan-release-${{ github.sha }}
      #     path: apps/web-app/android/app/build/outputs/bundle/release/app-release.aab

