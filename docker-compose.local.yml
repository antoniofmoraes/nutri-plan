services:
  api:
    build:
      context: ./apps/NutriPlan.Api
      dockerfile: Dockerfile
    container_name: nutriplan-api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      PORT: "3000"
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "3000:3000"
    develop:
      watch:
        - action: rebuild
          path: ./apps/NutriPlan.Api
          ignore:
            - bin/
            - obj/

  web:
    build:
      context: ./apps/web-app
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    container_name: nutriplan-web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api
    develop:
      watch:
        - action: rebuild
          path: ./apps/web-app
          ignore:
            - node_modules/
