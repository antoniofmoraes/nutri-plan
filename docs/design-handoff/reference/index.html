<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>PORTIO — Ferramenta de plano nutricional</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
  :root {
    --bg: #f7f4ec;
    --paper: #ffffff;
    --surface: #ffffff;
    --surface-alt: #efeadf;
    --surface-2: #f1ede2;
    --ink: #15140f;
    --ink-2: #2a281f;
    --muted: #7a766a;
    --muted-2: #a7a297;
    --line: #e2dccd;
    --line-2: #d6cfbd;
    --accent: #ff4d2e;
    --accent-ink: #ffffff;
    --accent-soft: #ffe6df;
    --good: #2f7a3a;
    --warn: #c08b1a;
    --danger: #c4341c;

    /* Macro palette — used ONLY in data-viz */
    --m-cal: #ff4d2e;
    --m-pro: #4a3df0;
    --m-carb: #e6b22b;
    --m-fat:  #1f9b8f;
    --m-fib:  #7a766a;

    --r-sm: 6px;
    --r-md: 10px;
    --r-lg: 14px;
    --r-xl: 22px;

    --shadow-1: 0 1px 0 rgba(20,18,12,.04), 0 1px 2px rgba(20,18,12,.04);
    --shadow-2: 0 1px 0 rgba(20,18,12,.04), 0 8px 24px -10px rgba(20,18,12,.12);
    --shadow-3: 0 1px 0 rgba(20,18,12,.04), 0 18px 40px -16px rgba(20,18,12,.18);

    --font-sans: "Space Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    --font-serif: "Instrument Serif", ui-serif, Georgia, serif;
  }

  /* Type pairing variants */
  [data-type="plex"] {
    --font-sans: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  [data-type="serif"] {
    --font-sans: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, monospace;
    --font-serif: "Instrument Serif", ui-serif, Georgia, serif;
  }

  /* Palette variants */
  [data-palette="ember"] {
    --accent: #ff4d2e; --accent-soft: #ffe6df;
    --m-cal: #ff4d2e; --m-pro: #4a3df0; --m-carb: #e6b22b; --m-fat: #1f9b8f;
  }
  [data-palette="moss"] {
    --accent: #2d6a3a; --accent-soft: #dee9d8;
    --m-cal: #2d6a3a; --m-pro: #6f48d9; --m-carb: #d49a1a; --m-fat: #c4341c;
  }
  [data-palette="cobalt"] {
    --accent: #1a3df0; --accent-soft: #dde2ff;
    --m-cal: #1a3df0; --m-pro: #c4341c; --m-carb: #e6b22b; --m-fat: #1f9b8f;
  }
  [data-palette="ink"] {
    --accent: #15140f; --accent-soft: #e2dccd; --accent-ink: #f7f4ec;
    --m-cal: #15140f; --m-pro: #4a3df0; --m-carb: #c4341c; --m-fat: #1f9b8f;
  }

  /* DARK MODE */
  [data-theme="dark"] {
    --bg: #0e0d0a;
    --paper: #16140f;
    --surface: #1a1813;
    --surface-alt: #221f18;
    --surface-2: #1e1c15;
    --ink: #f1ede2;
    --ink-2: #d7d3c5;
    --muted: #8a8576;
    --muted-2: #5d5a4f;
    --line: #2a2720;
    --line-2: #3a362c;
    --accent-soft: #2b1a13;
    --shadow-1: none;
    --shadow-2: 0 8px 24px -10px rgba(0,0,0,.5);
    --shadow-3: 0 18px 40px -16px rgba(0,0,0,.7);
  }
  [data-theme="dark"][data-palette="ink"] {
    --accent: #f1ede2; --accent-ink: #15140f; --accent-soft: #2a2720;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--ink);
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    font-feature-settings: "ss01", "ss02";
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb {
    background: var(--line-2);
    border-radius: 10px;
    border: 2px solid var(--bg);
  }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted-2); }

  /* Selection */
  ::selection { background: var(--accent); color: var(--accent-ink); }

  /* Utility */
  .mono { font-family: var(--font-mono); font-feature-settings: "tnum"; }
  .num { font-variant-numeric: tabular-nums; font-family: var(--font-mono); }
  .tag {
    display: inline-flex; align-items: center; gap: 5px;
    font-family: var(--font-mono); font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--muted);
  }
  .row { display: flex; align-items: center; }
  .gap-1 { gap: 4px; } .gap-2 { gap: 8px; } .gap-3 { gap: 12px; } .gap-4 { gap: 16px; } .gap-6 { gap: 24px; }

  button { font-family: inherit; }
  input, select, textarea { font-family: inherit; color: inherit; }

  /* Skeleton — fallback while React loads */
  .boot {
    position: fixed; inset: 0; display: grid; place-items: center;
    color: var(--ink);
  }
  .boot .mark {
    font: 700 28px/1 var(--font-sans);
    letter-spacing: -0.02em;
  }
</style>
</head>
<body>
  <div id="root">
    <div class="boot">
      <div class="mark">PORTIO<span style="color:var(--accent)">.</span></div>
    </div>
  </div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="ui.jsx"></script>
  <script type="text/babel" src="macro-viz.jsx"></script>
  <script type="text/babel" src="screen-auth.jsx"></script>
  <script type="text/babel" src="screen-dashboard.jsx"></script>
  <script type="text/babel" src="screen-plans.jsx"></script>
  <script type="text/babel" src="screen-plan-detail.jsx"></script>
  <script type="text/babel" src="screen-foods.jsx"></script>
  <script type="text/babel" src="screen-presets.jsx"></script>
  <script type="text/babel" src="screen-shopping.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
